name: l-essenza
services:
  app:
    build:
      context: .
      target: base
    volumes:
      - ./app:/var/www/html
    configs:
      - source: caddy_config
        target: /etc/frankenphp/Caddyfile
      - source: php_config
        target: /usr/local/etc/php/conf.d/app.ini
    ports:
      - 8000:80
    environment:
      APP_NAME: "L'Essenza"

      APP_LOCALE: it
      APP_FALLBACK_LOCALE: it
      APP_URL: http://localhost:8000
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: ${APP_KEY:?APP_KEY is required}

      SESSION_DRIVER: file
      CACHE_DRIVER: file

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: project_database
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: no-reply@lessenza.net
      MAIL_FROM_NAME: "L'Essenza"

      # SENTRY_LARAVEL_DSN: null
      # SENTRY_TRACES_SAMPLE_RATE: 0
    depends_on:
      - db

  vite:
    build:
      context: .
      target: base
    volumes:
      - ./app:/var/www/html
      - ./app/.npm:/var/www/html/.npm
    command: /bin/bash -c 'npm install && npm run dev -- . --host'
    ports:
      - 5173:5173

  db:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: project_database
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3306:3306

volumes:
  db:

configs:
  caddy_config:
    content: >-
      {
          frankenphp
          order php_server before file_server
      }

      :80 {
          encode zstd br gzip
          root * /var/www/html/public
          php_server
      }
  php_config:
    content: |
      [PHP]
      upload_max_filesize = 512M
      post_max_size = 512M
